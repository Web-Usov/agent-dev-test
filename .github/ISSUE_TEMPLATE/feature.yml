name: Новая функция
description: Предложить новую функциональность через spec-first процесс
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: Какую проблему нужно решить и для кого?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Какой результат должен получить пользователь или система?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: Перечислите проверяемые условия готовности.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Не входит в scope
      description: Что сознательно не делаем в рамках этой задачи?
  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: Ссылки, ограничения, примеры, скриншоты или связанные Issue.
